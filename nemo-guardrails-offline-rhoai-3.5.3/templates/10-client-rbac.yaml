apiVersion: v1
kind: ServiceAccount
metadata:
  name: nemo-playground-client
  namespace: @@NEMO_NAMESPACE@@
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nemo-playground-access
  namespace: @@NEMO_NAMESPACE@@
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nemo-playground-access
  namespace: @@NEMO_NAMESPACE@@
subjects:
  - kind: ServiceAccount
    name: nemo-playground-client
    namespace: @@NEMO_NAMESPACE@@
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nemo-playground-access
